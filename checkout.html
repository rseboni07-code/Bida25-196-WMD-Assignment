<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Checkout - Sweet Crumbs</title>

  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <style>

    body {
      background-color: #fff5f7;
      font-family: Arial, sans-serif;
    }

    .checkout-banner {

      background:
      linear-gradient(rgba(0,0,0,0.5),
      rgba(0,0,0,0.5)),
      url('https://images.unsplash.com/photo-1578985545062-69928b1d9587?q=80&w=1200&auto=format&fit=crop');

      background-size: cover;
      background-position: center;

      padding: 100px 20px;

      text-align: center;
      color: white;
    }

    .checkout-card {

      background: white;

      padding: 30px;

      border-radius: 15px;

      box-shadow: 0 5px 20px rgba(0,0,0,0.1);

      margin-top: -50px;

      position: relative;

      z-index: 10;
    }

    .btn-remove {

      background-color: crimson;
      color: white;
      border: none;
    }

    .btn-remove:hover {

      background-color: darkred;
    }

    .btn-confirm {

      background-color: #ff69b4;
      color: white;
      border: none;
      font-weight: bold;
    }

    .btn-confirm:hover {

      background-color: #ff1493;
    }

    footer {

      background-color: #f8c8dc;

      padding: 20px;

      text-align: center;

      margin-top: 50px;
    }

  </style>

</head>

<body>

  <!-- Navbar -->
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark">

    <div class="container">

      <a class="navbar-brand" href="index.html">
        Sweet Crumbs
      </a>

      <button
      class="navbar-toggler"
      type="button"
      data-bs-toggle="collapse"
      data-bs-target="#navbarNav">

        <span class="navbar-toggler-icon"></span>

      </button>

      <div class="collapse navbar-collapse" id="navbarNav">

        <ul class="navbar-nav ms-auto">

          <li class="nav-item">
            <a class="nav-link" href="index.html">
              Home
            </a>
          </li>

          <li class="nav-item">
            <a class="nav-link active" href="checkout.html">
              Checkout
            </a>
          </li>

        </ul>

      </div>

    </div>

  </nav>

  <!-- Banner -->
  <section class="checkout-banner">

    <h1 class="display-4 fw-bold">
      Checkout
    </h1>

    <p>
      Review your selected cakes
    </p>

  </section>

  <!-- Checkout Section -->
  <div class="container py-5">

    <div class="checkout-card">

      <h2 class="mb-4">
        Order Summary
      </h2>

      <table class="table table-bordered align-middle">

        <thead class="table-dark">

          <tr>

            <th>Cake</th>

            <th>Quantity</th>

            <th>Price</th>

            <th>Action</th>

          </tr>

        </thead>

        <tbody id="cart-items">

        </tbody>

      </table>

      <h4 class="text-end mb-4">

        Total:
        P<span id="total-price">0</span>

      </h4>

      <hr>

      <h2 class="mb-4">
        Delivery Information
      </h2>

      <form>

        <div class="row">

          <div class="col-md-6 mb-3">

            <input
            type="text"
            class="form-control"
            placeholder="Full Name"
            required>

          </div>

          <div class="col-md-6 mb-3">

            <input
            type="tel"
            class="form-control"
            placeholder="Phone Number"
            required>

          </div>

        </div>

        <div class="mb-3">

          <input
          type="email"
          class="form-control"
          placeholder="Email Address"
          required>

        </div>

        <div class="mb-3">

          <input
          type="text"
          class="form-control"
          placeholder="Delivery Address"
          required>

        </div>

        <div class="mb-4">

          <select class="form-select">

            <option selected>
              Select Payment Method
            </option>

            <option>
              Card Payment
            </option>

            <option>
              Cash on Delivery
            </option>

          </select>

        </div>

        <button
        type="submit"
        class="btn btn-confirm w-100">

          Confirm Order

        </button>

      </form>

    </div>

  </div>

  <!-- Footer -->
  <footer>

    <p>
      © 2026 Sweet Crumbs Cake Delivery
    </p>

    <p>
      Instagram | Facebook | WhatsApp
    </p>

  </footer>

  <!-- Bootstrap -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

  <!-- Cart Script -->
  <script>

    document.addEventListener("DOMContentLoaded", function () {

      let cart = JSON.parse(localStorage.getItem('cart')) || [];

      let cartItems = document.getElementById('cart-items');

      let total = 0;

      function displayCart() {

        cartItems.innerHTML = "";

        total = 0;

        cart.forEach((item, index) => {

          total += item.price;

          cartItems.innerHTML += `

          <tr>

            <td>${item.name}</td>

            <td>1</td>

            <td>P${item.price}</td>

            <td>

              <button
              type="button"
              class="btn btn-remove btn-sm"
              onclick="removeItem(${index})">

                Remove

              </button>

            </td>

          </tr>

          `;
        });

        document.getElementById('total-price').innerText = total;
      }

      window.removeItem = function(index) {

        cart.splice(index, 1);

        localStorage.setItem('cart', JSON.stringify(cart));

        displayCart();
      }

      displayCart();

    });

  </script>

</body>
</html>
