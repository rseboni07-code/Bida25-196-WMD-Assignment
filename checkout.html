<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Checkout - Sweet Crumbs</title>

  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <style>
    body {
      background-color: #fff5f7;
      font-family: Arial, sans-serif;
    }

    .checkout-banner {
      background-color: #f8c8dc;
      padding: 80px 20px;
      text-align: center;
    }

    .checkout-card {
      background: white;
      padding: 30px;
      border-radius: 15px;
      box-shadow: 0 5px 20px rgba(0,0,0,0.1);
    }

    footer {
      background-color: #f8c8dc;
      padding: 20px;
      text-align: center;
      margin-top: 50px;
    }
  </style>
</head>

<body>

  <!-- Navbar -->
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark">

    <div class="container">

      <a class="navbar-brand" href="index.html">
        Sweet Crumbs
      </a>

      <div class="collapse navbar-collapse">

        <ul class="navbar-nav ms-auto">

          <li class="nav-item">
            <a class="nav-link" href="index.html">
              Home
            </a>
          </li>

          <li class="nav-item">
            <a class="nav-link active" href="checkout.html">
              Checkout
            </a>
          </li>

        </ul>

      </div>

    </div>

  </nav>

  <!-- Banner -->
  <section class="checkout-banner">

    <h1 class="display-4 fw-bold">
      Checkout
    </h1>

    <p>
      Review your cake order
    </p>

  </section>

  <!-- Checkout -->
  <div class="container py-5">

    <div class="checkout-card">

      <h2 class="mb-4">
        Order Summary
      </h2>

      <table class="table table-bordered">

        <thead>
          <tr>
            <th>Cake</th>
            <th>Quantity</th>
            <th>Price</th>
          </tr>
        </thead>

        <tbody id="cart-items">

        </tbody>

      </table>

      <h4 class="text-end">
        Total: P<span id="total-price">0</span>
      </h4>

      <hr>

      <h2 class="mb-4">
        Delivery Information
      </h2>

      <form>

        <div class="mb-3">
          <input type="text"
          class="form-control"
          placeholder="Full Name"
          required>
        </div>

        <div class="mb-3">
          <input type="text"
          class="form-control"
          placeholder="Delivery Address"
          required>
        </div>

        <div class="mb-3">
          <input type="tel"
          class="form-control"
          placeholder="Phone Number"
          required>
        </div>

        <button type="submit"
        class="btn btn-dark w-100">

          Confirm Order

        </button>

      </form>

    </div>

  </div>

  <!-- Footer -->
  <footer>
    <p>© 2026 Sweet Crumbs Cake Delivery</p>
  </footer>

  <!-- Cart Script -->
  <script>

    let cart = JSON.parse(localStorage.getItem('cart')) || [];

    let cartItems = document.getElementById('cart-items');

    let total = 0;

    cart.forEach(item => {

      total += item.price;

      cartItems.innerHTML += `
        <tr>
          <td>${item.name}</td>
          <td>1</td>
          <td>P${item.price}</td>
        </tr>
      `;
    });

    document.getElementById('total-price').innerText = total;

  </script>

</body>
</html>
