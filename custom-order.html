<body style="background-color:#fff5f7;">

<div class="container py-5">
  <h1 class="text-center mb-5">Custom Cake Orders</h1>

  <div class="card shadow p-4">
    <form>
      <input type="text" class="form-control mb-3" placeholder="Full Name" required>

      <input type="email" class="form-control mb-3" placeholder="Email Address" required>

      <input type="tel" class="form-control mb-3" placeholder="Phone Number" required>

      <select class="form-select mb-3">
        <option>Select Cake Type</option>
        <option>Birthday Cake</option>
        <option>Wedding Cake</option>
        <option>Cupcakes</option>
      </select>

      <input type="text" class="form-control mb-3" placeholder="Preferred Flavour">

      <textarea class="form-control mb-3" rows="5" placeholder="Describe Your Custom Design"></textarea>

      <input type="date" class="form-control mb-3">

      <button class="btn btn-dark w-100">Submit Custom Order</button>
    </form>
  </div>
</div>
