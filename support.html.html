<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Support - Sweet Crumbs</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body style="background-color:#fff5f7;">

<div class="container py-5">
  <h1 class="text-center mb-5">Customer Support</h1>

  <div class="card p-4 shadow">
    <h3>Need Help?</h3>

    <p>
      Contact our support team for help with orders, deliveries,
      payments, or custom cake requests.
    </p>

    <form>
      <input type="text" class="form-control mb-3" placeholder="Your Name">

      <input type="email" class="form-control mb-3" placeholder="Your Email">

      <textarea class="form-control mb-3" rows="5" placeholder="Describe your issue"></textarea>

      <button class="btn btn-dark w-100">Submit Support Request</button>
    </form>

    <div class="mt-4">
      <h5>Contact Information</h5>
      <p>Email: support@sweetcrumbs.com</p>
      <p>Phone: +267 71778688</p>
    </div>
  </div>
</div>

</body>
</html>
