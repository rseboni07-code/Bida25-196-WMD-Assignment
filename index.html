<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Sweet Crumbs Cake Delivery</title>

  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <style>

    body {
      background-color: #fff5f7;
      font-family: Arial, sans-serif;
    }

    .hero {
      background:
      linear-gradient(rgba(0,0,0,0.5),
      rgba(0,0,0,0.5)),
      url('https://images.unsplash.com/photo-1578985545062-69928b1d9587?q=80&w=1200&auto=format&fit=crop');

      background-size: cover;
      background-position: center;

      height: 500px;

      display: flex;
      justify-content: center;
      align-items: center;

      text-align: center;
      color: white;
    }

    .hero h1 {
      font-weight: bold;
    }

    .gallery-img {
      height: 250px;
      width: 100%;
      object-fit: cover;
      transition: 0.3s ease;
    }

    .gallery-img:hover {
      transform: scale(1.05);
    }

    footer {
      background-color: #f8c8dc;
      padding: 20px;
      text-align: center;
      margin-top: 50px;
    }

  </style>

</head>

<body>

  <!-- Navbar -->
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark">

    <div class="container">

      <a class="navbar-brand" href="index.html">
        Sweet Crumbs
      </a>

      <button class="navbar-toggler"
      type="button"
      data-bs-toggle="collapse"
      data-bs-target="#navbarNav">

        <span class="navbar-toggler-icon"></span>

      </button>

      <div class="collapse navbar-collapse" id="navbarNav">

        <ul class="navbar-nav ms-auto">

          <li class="nav-item">
            <a class="nav-link active" href="index.html">
              Home
            </a>
          </li>

          <li class="nav-item">
            <a class="nav-link" href="about.html">
              About
            </a>
          </li>

          <li class="nav-item">
            <a class="nav-link" href="custom-order.html">
              Custom Orders
            </a>
          </li>

          <li class="nav-item">
            <a class="nav-link" href="checkout.html">
              Checkout
            </a>
          </li>

          <li class="nav-item">
            <a class="nav-link" href="support.html">
              Support
            </a>
          </li>

        </ul>

      </div>

    </div>

  </nav>

  <!-- Hero Section -->
  <section class="hero">

    <div>

      <h1 class="display-3">
        Delicious Cakes Delivered To You
      </h1>

      <a href="#cakes"
      class="btn btn-light btn-lg mt-3">

        Order Now

      </a>

    </div>

  </section>

  <!-- Featured Cakes -->
  <section class="container py-5" id="cakes">

    <h2 class="text-center fw-bold mb-5">
      Featured Cakes
    </h2>

    <div class="row g-4">

      <!-- Chocolate Cake -->
      <div class="col-md-4">

        <div class="card shadow">

          <img
          src="https://images.unsplash.com/photo-1606890737304-57a1ca8a5b62?q=80&w=800&auto=format&fit=crop"
          class="card-img-top"
          alt="Chocolate Cake">

          <div class="card-body text-center">

            <h5 class="card-title">
              Chocolate Cake
            </h5>

            <p class="card-text">
              P250
            </p>

            <button class="btn btn-primary"
            onclick="addToCart('Chocolate Cake', 250)">

              Add to Cart

            </button>

          </div>

        </div>

      </div>

      <!-- Strawberry Cake -->
      <div class="col-md-4">

        <div class="card shadow">

          <img
          src="https://images.unsplash.com/photo-1621303837174-89787a7d4729?q=80&w=800&auto=format&fit=crop"
          class="card-img-top"
          alt="Strawberry Cake">

          <div class="card-body text-center">

            <h5 class="card-title">
              Strawberry Cake
            </h5>

            <p class="card-text">
              P300
            </p>

            <button class="btn btn-primary"
            onclick="addToCart('Strawberry Cake', 300)">

              Add to Cart

            </button>

          </div>

        </div>

      </div>

      <!-- Wedding Cake -->
      <div class="col-md-4">

        <div class="card shadow">

          <img
          src="https://images.unsplash.com/photo-1535254973040-607b474cb50d?q=80&w=800&auto=format&fit=crop"
          class="card-img-top"
          alt="Wedding Cake">

          <div class="card-body text-center">

            <h5 class="card-title">
              Wedding Cake
            </h5>

            <p class="card-text">
              P800
            </p>

            <button class="btn btn-primary"
            onclick="addToCart('Wedding Cake', 800)">

              Add to Cart

            </button>

          </div>

        </div>

      </div>

    </div>

  </section>

  <!-- Cake Gallery -->
  <section class="container py-5">

    <h2 class="text-center fw-bold mb-5">
      Cake Gallery
    </h2>

    <div class="row g-4">

      <div class="col-lg-3 col-md-4 col-sm-6">
        <img
        src="https://images.unsplash.com/photo-1578985545062-69928b1d9587?q=80&w=800&auto=format&fit=crop"
        class="img-fluid rounded shadow gallery-img"
        alt="Cake">
      </div>

      <div class="col-lg-3 col-md-4 col-sm-6">
        <img
        src="https://images.unsplash.com/photo-1559620192-032c4bc4674e?q=80&w=800&auto=format&fit=crop"
        class="img-fluid rounded shadow gallery-img"
        alt="Cake">
      </div>

      <div class="col-lg-3 col-md-4 col-sm-6">
        <img
        src="https://images.unsplash.com/photo-1509440159596-0249088772ff?q=80&w=800&auto=format&fit=crop"
        class="img-fluid rounded shadow gallery-img"
        alt="Cake">
      </div>

         <div class="col-lg-3 col-md-4 col-sm-6">
        <img
        src="https://images.unsplash.com/photo-1519869325930-281384150729?q=80&w=900&auto=format&fit=crop"
        class="img-fluid rounded shadow gallery-img"
        alt="Cake">
      </div>

       <div class="col-lg-3 col-md-4 col-sm-6">
        <img
        src="https://images.unsplash.com/photo-1559622214-f8a9850965bb?q=80&w=900&auto=format&fit=crop"
        class="img-fluid rounded shadow gallery-img"
        alt="Cake">
      </div>


  </section>

  <!-- Footer -->
  <footer>

    <p>
      © 2026 Sweet Crumbs Cake Delivery
    </p>

    <p>
      Instagram | Facebook | WhatsApp
    </p>

  </footer>

  <!-- Bootstrap -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

  <!-- Cart Script -->
  <script>

    function addToCart(name, price) {

      let cart = JSON.parse(localStorage.getItem('cart')) || [];

      cart.push({
        name: name,
        price: price
      });

      localStorage.setItem('cart', JSON.stringify(cart));

      alert(name + " added to cart!");
    }

  </script>

</body>
</html>
