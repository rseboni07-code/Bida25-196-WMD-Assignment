  <!-- Bootstrap 5 -->

  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #fff5f7;
    }

    .hero {
      height: 500px;
      background: url('https://images.unsplash.com/photo-1578985545062-69928b1d9587?q=80&w=1200&auto=format&fit=crop') center/cover no-repeat;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      color: white;
    }

    .hero h1 {
      font-size: 4rem;
      font-weight: bold;
      text-shadow: 2px 2px 10px rgba(0,0,0,0.5);
      animation: fadeIn 2s ease-in-out;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(-20px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .section-title {
      text-align: center;
      margin: 50px 0 20px;
      font-weight: bold;
    }

    .card img {
      height: 250px;
      object-fit: cover;
    }

    footer {
      background-color: #f8c8dc;
      padding: 20px;
      text-align: center;
      margin-top: 40px;
    }

    @media screen and (max-width: 768px) {
      .hero h1 {
        font-size: 2.5rem;

        .gallery-img {
    height: 250px;
    width: 100%;
    object-fit: cover;
    transition: 0.3s ease;
}

.gallery-img:hover {
    transform: scale(1.05);
}
      }
    }
  </style>
</head>

  <nav class="navbar navbar-expand-lg navbar-dark bg-dark sticky-top">

        <li class="nav-item">

        <li class="nav-item">

  <!-- Hero Section -->
  <section class="hero" id="home">
    <div>
      <h1>Delicious Cakes Delivered To You</h1>
      <button class="btn btn-light btn-lg mt-3" onclick="orderNow()">Order Now</button>
    </div>
  </section>

  <!-- Cakes Section -->
  <section class="container" id="cakes">
    <h2 class="section-title">Featured Cakes</h2>

    <div class="row g-4">

      <div class="col-md-4">
        <div class="card shadow">
          <img src="https://images.unsplash.com/photo-1563729784474-d77dbb933a9e?q=80&w=800&auto=format&fit=crop" class="card-img-top" alt="Chocolate Cake">
          <div class="card-body text-center">
            <h5 class="card-title">Chocolate Cake</h5>
            <p class="card-text">P250</p>
            <button class="btn btn-pink btn-primary" onclick="addToCart('Chocolate Cake')">Add to Cart</button>
          </div>
        </div>
      </div>

      <div class="col-md-4">
        <div class="card shadow">
          <img src="https://images.unsplash.com/photo-1621303837174-89787a7d4729?q=80&w=800&auto=format&fit=crop" class="card-img-top" alt="Strawberry Cake">
          <div class="card-body text-center">
            <h5 class="card-title">Strawberry Cake</h5>
            <p class="card-text">P300</p>
            <button class="btn btn-primary" onclick="addToCart('Strawberry Cake')">Add to Cart</button>
          </div>
        </div>
      </div>

      <div class="col-md-4">
        <div class="card shadow">
          <img src="https://images.unsplash.com/photo-1488477181946-6428a0291777?q=80&w=800&auto=format&fit=crop" class="card-img-top" alt="Wedding Cake">
          <div class="card-body text-center">
            <h5 class="card-title">Wedding Cake</h5>
            <p class="card-text">P800</p>
            <button class="btn btn-primary" onclick="addToCart('Wedding Cake')">Add to Cart</button>
          </div>
        </div>
      </div>

    </div>
  </section>
  <!-- Cake Gallery Section -->
<section class="container py-5">

    <div class="col-md-3 col-sm-6">

  <!-- JavaScript -->
  <script>
    function addToCart(cakeName) {
      alert(cakeName + ' added to cart!');
    }

    function orderNow() {
      document.getElementById('cakes').scrollIntoView({
        behavior: 'smooth'
      });
    }

    function submitForm(event) {
      event.preventDefault();
      alert('Message sent successfully!');
    }
